[package]
name = "tts_engine"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
sentencepiece-rs = "0.2"
once_cell = "1.19"
regex = "1.11"
pinyin = "0.10"
jpreprocess = { version = "0.15", features = ["naist-jdic", "tokenizer"] }
jlabel = "0.1"
unicode-normalization = "0.1"
num2words2-core = "0.1.2"
num-bigint = "0.4"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

# Keep Cargo build artifacts out of the TTS ./target package directory
[workspace]
